  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // 통화 추가 시트(picker)에서만 USD, EUR을 맨 위에 고정
    const PICKER_PINNED_TOP = ['USD', 'EUR'];

    const CURRENCIES_RAW = [
      { code: 'USD', name: '미국 달러', flag: '🇺🇸' },
      { code: 'EUR', name: '유로', flag: '🇪🇺' },
      { code: 'JPY', name: '일본 엔', flag: '🇯🇵' },
      { code: 'CNY', name: '중국 위안', flag: '🇨🇳' },
      { code: 'GBP', name: '영국 파운드', flag: '🇬🇧' },
      { code: 'AUD', name: '호주 달러', flag: '🇦🇺' },
      { code: 'CAD', name: '캐나다 달러', flag: '🇨🇦' },
      { code: 'CHF', name: '스위스 프랑', flag: '🇨🇭' },
      { code: 'HKD', name: '홍콩 달러', flag: '🇭🇰' },
      { code: 'SGD', name: '싱가포르 달러', flag: '🇸🇬' },
      { code: 'THB', name: '태국 바트', flag: '🇹🇭' },
      { code: 'VND', name: '베트남 동', flag: '🇻🇳' },
      { code: 'IDR', name: '인도네시아 루피아', flag: '🇮🇩' },
      { code: 'MYR', name: '말레이시아 링깃', flag: '🇲🇾' },
      { code: 'PHP', name: '필리핀 페소', flag: '🇵🇭' },
      { code: 'INR', name: '인도 루피', flag: '🇮🇳' },
      { code: 'TWD', name: '대만 달러', flag: '🇹🇼' },
      { code: 'TRY', name: '터키 리라', flag: '🇹🇷' },
      { code: 'BRL', name: '브라질 헤알', flag: '🇧🇷' },
      { code: 'MXN', name: '멕시코 페소', flag: '🇲🇽' },
      { code: 'RUB', name: '러시아 루블', flag: '🇷🇺' },
      { code: 'AED', name: 'UAE 디르함', flag: '🇦🇪' },
      { code: 'SAR', name: '사우디 리얄', flag: '🇸🇦' },
      { code: 'NZD', name: '뉴질랜드 달러', flag: '🇳🇿' },
      { code: 'SEK', name: '스웨덴 크로나', flag: '🇸🇪' },
      { code: 'NOK', name: '노르웨이 크로네', flag: '🇳🇴' },
      { code: 'DKK', name: '덴마크 크로네', flag: '🇩🇰' },
      { code: 'PLN', name: '폴란드 즈워티', flag: '🇵🇱' },
      { code: 'CZK', name: '체코 코루나', flag: '🇨🇿' },
      { code: 'HUF', name: '헝가리 포린트', flag: '🇭🇺' },
      { code: 'ZAR', name: '남아공 랜드', flag: '🇿🇦' },
    ];

    // 추가 시트에서 보여줄 정렬된 통화 목록 (USD, EUR 상단 고정)
    const CURRENCIES_FOR_PICKER = [
      ...PICKER_PINNED_TOP.map(code => CURRENCIES_RAW.find(c => c.code === code)).filter(Boolean),
      ...CURRENCIES_RAW
        .filter(c => !PICKER_PINNED_TOP.includes(c.code))
        .sort((a, b) => a.code.localeCompare(b.code)),
    ];

    const KRW_CURRENCY = { code: 'KRW', name: '대한민국 원', flag: '🇰🇷' };

    const STORAGE_KEY = 'exchange_calc_v3';
    const DEFAULT_RATES_DATE = '2026-05-13';
    const DEFAULT_RATES = {
      USD: 1, KRW: 1488, EUR: 0.852, JPY: 157.6, CNY: 6.79, GBP: 0.739,
      AUD: 1.383, CAD: 1.37, CHF: 0.781, HKD: 7.83, SGD: 1.27, THB: 32.39,
      VND: 25500, IDR: 17509, MYR: 3.93, PHP: 61.48, INR: 95.62, TWD: 31.51,
      TRY: 38.5, BRL: 5.5, MXN: 17.25, RUB: 90, AED: 3.67, SAR: 3.75,
      NZD: 1.681, SEK: 9.29, NOK: 10.8, DKK: 6.36, PLN: 4.2, CZK: 23.0,
      HUF: 304.5, ZAR: 18.5,
    };

    // Inline SVG icons
    const Icon = ({ d, size = 18, strokeWidth = 2, ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" {...props}>{d}</svg>
    );
    const PlusIcon = (props) => <Icon {...props} d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
    const XIcon = (props) => <Icon {...props} d={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />;
    const SearchIcon = (props) => <Icon {...props} d={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />;
    const DeleteIcon = (props) => <Icon {...props} d={<><path d="M21 5H9l-7 7 7 7h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></>} />;
    const RefreshIcon = (props) => <Icon {...props} d={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></>} />;
    const WalletIcon = (props) => <Icon {...props} d={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />;
    const CalendarIcon = (props) => <Icon {...props} d={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />;
    // 위아래 화살표 아이콘 (순서 변경 가능 표시)
    const SortArrowIcon = ({ size = 18, ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="m7 15 5 5 5-5" />
        <path d="m7 9 5-5 5 5" />
      </svg>
    );

    function App() {
      const [foreignCodes, setForeignCodes] = useState(['USD', 'EUR', 'JPY']);
      const [inputCode, setInputCode] = useState('EUR'); // 키패드 입력 대상 통화
      const [amount, setAmount] = useState('100');
      const [showSheet, setShowSheet] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [rates, setRates] = useState(DEFAULT_RATES);
      const [ratesDate, setRatesDate] = useState(DEFAULT_RATES_DATE);
      const [refreshing, setRefreshing] = useState(false);
      const [statusMsg, setStatusMsg] = useState('');
      const [draggedCode, setDraggedCode] = useState(null);

      // 계산기 상태 (×, ÷)
      const [firstOperand, setFirstOperand] = useState(null);
      const [pendingOp, setPendingOp] = useState(null); // '×' | '÷' | null
      const [resetOnNext, setResetOnNext] = useState(false);

      // 삭제 확인 단계 (X 버튼 두 번 눌러야 삭제)
      const [pendingDelete, setPendingDelete] = useState(null);
      useEffect(() => {
        if (!pendingDelete) return;
        const t = setTimeout(() => setPendingDelete(null), 3000);
        return () => clearTimeout(t);
      }, [pendingDelete]);

      // 드래그 관련 refs
      const longPressTimer = useRef(null);
      const dragStartY = useRef(0);
      const wasDragging = useRef(false);
      const rowRefs = useRef({});
      const foreignCodesRef = useRef(foreignCodes);
      useEffect(() => { foreignCodesRef.current = foreignCodes; }, [foreignCodes]);

      // localStorage 로드
      useEffect(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const cached = JSON.parse(stored);
            if (cached.rates) setRates(cached.rates);
            if (cached.date) setRatesDate(cached.date);
            if (cached.foreignCodes) setForeignCodes(cached.foreignCodes);
            if (cached.inputCode) setInputCode(cached.inputCode);
          }
        } catch (e) {}
      }, []);

      // 환율 자동 갱신 (어제 환율 기준)
      useEffect(() => {
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(today.getDate() - 1);
        const ymdY = yesterday.toISOString().split('T')[0];
        if (ratesDate < ymdY) {
          refreshRates(true);
        }
      }, []);

      const refreshRates = async (silent = false) => {
        if (refreshing) return;
        setRefreshing(true);
        if (!silent) setStatusMsg('환율 갱신 중...');
        try {
          const res = await fetch('https://open.er-api.com/v6/latest/USD');
          if (!res.ok) throw new Error('네트워크 오류');
          const data = await res.json();
          if (data.result === 'success' && data.rates) {
            const updateDate = new Date(data.time_last_update_unix * 1000)
              .toISOString().split('T')[0];
            setRates(data.rates);
            setRatesDate(updateDate);
            saveState({ rates: data.rates, date: updateDate });
            if (!silent) {
              setStatusMsg('환율을 새로 받아왔습니다');
              setTimeout(() => setStatusMsg(''), 2000);
            }
          } else {
            throw new Error('데이터 형식 오류');
          }
        } catch (e) {
          if (!silent) {
            setStatusMsg('환율 갱신 실패 (저장된 환율 사용)');
            setTimeout(() => setStatusMsg(''), 2500);
          }
        } finally {
          setRefreshing(false);
        }
      };

      const saveState = (overrides = {}) => {
        try {
          const data = {
            rates: overrides.rates ?? rates,
            date: overrides.date ?? ratesDate,
            foreignCodes: overrides.foreignCodes ?? foreignCodesRef.current,
            inputCode: overrides.inputCode ?? inputCode,
            fetchedAt: new Date().toISOString(),
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {}
      };

      const allWithKrw = [...CURRENCIES_RAW, KRW_CURRENCY];
      const getCurrency = (code) => allWithKrw.find(c => c.code === code);

      const formatNumber = (n, code) => {
        if (!isFinite(n)) return '—';
        return Math.round(n).toLocaleString('ko-KR');
      };
      const formatTypedAmount = (str) => {
        if (!str || str === '0') return '0';
        if (str === '0.') return '0.';
        const [intPart, decPart] = str.split('.');
        const intFormatted = parseInt(intPart || '0').toLocaleString('ko-KR');
        return decPart !== undefined ? `${intFormatted}.${decPart}` : intFormatted;
      };
      const convert = (code) => {
        if (code === inputCode) return formatTypedAmount(amount);
        if (!rates[inputCode] || !rates[code]) return '—';
        const n = parseFloat(amount) || 0;
        const usd = n / rates[inputCode];
        return formatNumber(usd * rates[code], code);
      };
      // 계산 보조
      const compute = (a, op, b) => {
        const x = parseFloat(a) || 0;
        const y = parseFloat(b) || 0;
        if (op === '×') return x * y;
        if (op === '÷') return y !== 0 ? x / y : 0;
        return y;
      };
      const formatComputed = (n) => {
        if (!isFinite(n)) return '0';
        if (Math.abs(n - Math.round(n)) < 0.000001) return String(Math.round(n));
        // 최대 6자리 소수 유지하되 trailing 0 제거
        return String(parseFloat(n.toFixed(6)));
      };

      const handleKey = (key) => {
        // 연산자 ×, ÷
        if (key === '×' || key === '÷') {
          if (pendingOp && !resetOnNext) {
            // 직전 연산 먼저 계산
            const result = formatComputed(compute(firstOperand, pendingOp, amount));
            setAmount(result);
            setFirstOperand(result);
          } else {
            setFirstOperand(amount);
          }
          setPendingOp(key);
          setResetOnNext(true);
          return;
        }
        // = 평가
        if (key === '=') {
          if (pendingOp && firstOperand !== null) {
            const result = formatComputed(compute(firstOperand, pendingOp, amount));
            setAmount(result);
            setFirstOperand(null);
            setPendingOp(null);
            setResetOnNext(true);
          }
          return;
        }
        // 백스페이스
        if (key === '⌫') {
          if (resetOnNext) {
            setAmount('0');
            setResetOnNext(false);
          } else {
            setAmount(prev => prev.length <= 1 ? '0' : prev.slice(0, -1));
          }
          return;
        }
        // 소수점
        if (key === '.') {
          if (resetOnNext) {
            setAmount('0.');
            setResetOnNext(false);
          } else {
            setAmount(prev => prev.includes('.') ? prev : prev + '.');
          }
          return;
        }
        // 숫자
        if (resetOnNext) {
          setAmount(key);
          setResetOnNext(false);
          return;
        }
        setAmount(prev => {
          if (prev === '0') return key;
          const digits = prev.replace('.', '');
          if (digits.length >= 14) return prev;
          return prev + key;
        });
      };
      const clearAll = () => {
        setAmount('0');
        setFirstOperand(null);
        setPendingOp(null);
        setResetOnNext(false);
      };
      const addForeign = (code) => {
        if (!foreignCodes.includes(code)) {
          const newCodes = [...foreignCodes, code];
          setForeignCodes(newCodes);
          setInputCode(code);
          saveState({ foreignCodes: newCodes, inputCode: code });
        }
        setShowSheet(false);
        setSearchQuery('');
      };
      const removeForeign = (code) => {
        const remaining = foreignCodes.filter(c => c !== code);
        setForeignCodes(remaining);
        let newInput = inputCode;
        if (inputCode === code) {
          newInput = remaining.length > 0 ? remaining[0] : 'KRW';
          setInputCode(newInput);
        }
        saveState({ foreignCodes: remaining, inputCode: newInput });
      };
      const selectInput = (code) => {
        setInputCode(code);
        saveState({ inputCode: code });
      };

      // === 드래그 핸들러 (외화 행) ===
      const handleTouchStart = (code) => (e) => {
        if (code === 'KRW') return; // KRW는 드래그 불가
        wasDragging.current = false;
        dragStartY.current = e.touches[0].clientY;
        longPressTimer.current = setTimeout(() => {
          setDraggedCode(code);
          wasDragging.current = true;
          if (navigator.vibrate) navigator.vibrate(40);
        }, 450);
      };
      const handleTouchMove = (e) => {
        if (draggedCode === null) {
          // 아직 드래그 모드 아님 → 8px 이상 스크롤이면 long-press 취소
          const dy = Math.abs(e.touches[0].clientY - dragStartY.current);
          if (dy > 8 && longPressTimer.current) {
            clearTimeout(longPressTimer.current);
            longPressTimer.current = null;
          }
          return;
        }
        // 드래그 모드 → 페이지 스크롤 막고 위치 갱신
        e.preventDefault();
        const y = e.touches[0].clientY;
        for (const code of Object.keys(rowRefs.current)) {
          if (code === draggedCode || code === 'KRW') continue;
          const el = rowRefs.current[code];
          if (!el) continue;
          const rect = el.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          if (y >= rect.top && y <= rect.bottom) {
            // 가운데 기준 50% 넘어가야 swap (떨림 방지)
            setForeignCodes(prev => {
              const fromIdx = prev.indexOf(draggedCode);
              const toIdx = prev.indexOf(code);
              if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return prev;
              const newList = [...prev];
              const [moved] = newList.splice(fromIdx, 1);
              newList.splice(toIdx, 0, moved);
              return newList;
            });
            break;
          }
        }
      };
      const handleTouchEnd = () => {
        if (longPressTimer.current) {
          clearTimeout(longPressTimer.current);
          longPressTimer.current = null;
        }
        if (draggedCode !== null) {
          saveState({ foreignCodes: foreignCodesRef.current });
          setDraggedCode(null);
          if (navigator.vibrate) navigator.vibrate(20);
        }
      };

      const hiddenForeign = CURRENCIES_FOR_PICKER.filter(c =>
        !foreignCodes.includes(c.code) &&
        (searchQuery === '' ||
          c.code.toLowerCase().includes(searchQuery.toLowerCase()) ||
          c.name.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      const numberKeyStyle = {
        padding: '18px 0', fontSize: '28px', fontWeight: 700,
        background: '#ffffff', color: '#1a1a1a', border: 'none',
        borderRadius: '14px',
        boxShadow: '0 3px 0 rgba(0,0,0,0.09), 0 6px 16px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.85)',
        cursor: 'pointer', fontFamily: 'inherit',
        letterSpacing: '0.3px',
      };
      // 연산자 키 (×, ÷): 따뜻한 오렌지
      const opKeyStyle = {
        padding: '18px 0', fontSize: '30px', fontWeight: 800,
        background: 'linear-gradient(135deg, #f4a261 0%, #e76f51 100%)',
        color: '#fff', border: 'none',
        borderRadius: '14px',
        boxShadow: '0 3px 0 rgba(160, 60, 40, 0.35), 0 6px 16px rgba(231, 111, 81, 0.30), inset 0 1px 0 rgba(255,255,255,0.30)',
        cursor: 'pointer', fontFamily: 'inherit',
        letterSpacing: '0.3px', lineHeight: 1,
      };
      // 활성화된 연산자 (입력 대기 중): 반전 (흰 배경에 오렌지 글자)
      const opActiveStyle = {
        ...opKeyStyle,
        background: '#ffffff',
        color: '#e76f51',
        boxShadow: '0 3px 0 rgba(0,0,0,0.10), 0 6px 16px rgba(231, 111, 81, 0.4), inset 0 0 0 2.5px #e76f51',
      };
      // = 키: 짙은 청록 (확정 색)
      const equalsKeyStyle = {
        ...opKeyStyle,
        background: 'linear-gradient(135deg, #1a5252 0%, #0a3d3d 100%)',
        boxShadow: '0 3px 0 rgba(0, 30, 30, 0.40), 0 6px 16px rgba(10, 61, 61, 0.30), inset 0 1px 0 rgba(255,255,255,0.18)',
      };

      const displayDate = ratesDate.replace(/-/g, '.');

      const renderRow = (code, opts = {}) => {
        const c = getCurrency(code);
        const isKrw = code === 'KRW';
        const isInput = code === inputCode;
        const isDragged = code === draggedCode;
        const someoneIsDragged = draggedCode !== null;

        // 색상 규칙:
        //  - KRW: 항상 짙은 청록 (구분색)
        //  - 외화: 항상 흰색
        //  - 입력대상(선택): 가는 청록 링 + 살짝 두꺼운 그림자
        const baseShadow = isKrw
          ? '0 8px 22px rgba(10, 61, 61, 0.22), 0 2px 4px rgba(10, 61, 61, 0.10)'
          : '0 1px 2px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.03)';
        const inputRing = isKrw
          ? '0 0 0 2px rgba(255, 255, 255, 0.55), 0 0 0 4px rgba(10, 61, 61, 0.18)'
          : '0 0 0 2px #0a3d3d, 0 0 0 5px rgba(10, 61, 61, 0.12)';
        const dragShadow = '0 16px 36px rgba(10, 61, 61, 0.35), 0 4px 8px rgba(0, 0, 0, 0.15)';

        return (
          <div
            key={code}
            ref={el => { if (el) rowRefs.current[code] = el; else delete rowRefs.current[code]; }}
            onClick={() => {
              if (wasDragging.current) {
                wasDragging.current = false;
                return;
              }
              selectInput(code);
            }}
            onTouchStart={handleTouchStart(code)}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            onTouchCancel={handleTouchEnd}
            className="row-card row-anim"
            style={{
              display: 'flex', alignItems: 'center',
              padding: '11px 16px',
              marginBottom: opts.noMargin ? 0 : '6px',
              background: isKrw ? '#0a3d3d' : '#ffffff',
              borderRadius: '18px',
              boxShadow: isDragged ? dragShadow : (isInput ? inputRing + ', ' + baseShadow : baseShadow),
              cursor: 'pointer', minHeight: '64px',
              position: 'relative', overflow: 'visible',
              transform: isDragged ? 'scale(1.03)' : 'scale(1)',
              zIndex: isDragged ? 5 : 1,
              opacity: someoneIsDragged && !isDragged && !isKrw ? 0.7 : 1,
              touchAction: someoneIsDragged ? 'none' : 'auto',
              userSelect: 'none', WebkitUserSelect: 'none',
            }}
          >
            {isKrw && (
              <div style={{
                position: 'absolute', top: 9, right: 16,
                fontSize: '9px', color: 'rgba(255,255,255,0.55)',
                fontWeight: 700, letterSpacing: '1.5px',
              }}>원화</div>
            )}
            {!isKrw && (
              <div style={{
                marginRight: '10px', flexShrink: 0,
                color: isInput ? '#0a3d3d' : '#b8b8b8',
                opacity: isInput ? 0.9 : 1,
                display: 'flex', alignItems: 'center',
              }}>
                <SortArrowIcon size={20} />
              </div>
            )}
            <div style={{ fontSize: '34px', marginRight: '14px', lineHeight: 1, flexShrink: 0 }}>{c?.flag}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: '7px',
              }}>
                <span style={{
                  fontSize: '17px', fontWeight: 800,
                  color: isKrw ? '#fff' : '#1a1a1a',
                  letterSpacing: '0.4px', lineHeight: 1.2,
                }}>{code}</span>
                {isInput && (
                  <span style={{
                    fontSize: '10px',
                    padding: '2px 7px',
                    background: isKrw ? 'rgba(255,255,255,0.22)' : '#0a3d3d',
                    color: isKrw ? '#fff' : '#fff',
                    borderRadius: '7px',
                    letterSpacing: '0.5px',
                    fontWeight: 700,
                    lineHeight: 1.3,
                    flexShrink: 0,
                  }}>입력</span>
                )}
              </div>
              <div style={{
                fontSize: '13.5px',
                fontWeight: 600,
                color: isKrw ? 'rgba(255,255,255,0.88)' : '#555',
                marginTop: '4px',
                letterSpacing: '-0.2px',
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }}>{c?.name}</div>
            </div>
            <div className="tabular" style={{
              fontSize: '22px', fontWeight: 700,
              color: isKrw ? '#fff' : '#1a1a1a',
              letterSpacing: '-0.5px',
              marginRight: !isKrw ? '8px' : 0,
              textAlign: 'right',
            }}>{convert(code)}</div>
            {!isKrw && (
              pendingDelete === code ? (
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    removeForeign(code);
                    setPendingDelete(null);
                  }}
                  onTouchStart={(e) => e.stopPropagation()}
                  style={{
                    padding: '6px 11px', height: '28px',
                    borderRadius: '14px',
                    background: 'linear-gradient(135deg, #e76f51 0%, #c84a36 100%)',
                    color: '#fff', border: 'none',
                    cursor: 'pointer', flexShrink: 0,
                    fontSize: '11px', fontWeight: 800,
                    fontFamily: 'inherit',
                    letterSpacing: '0.4px',
                    boxShadow: '0 2px 6px rgba(200, 74, 54, 0.35)',
                    animation: 'pulseIn 0.18s ease-out',
                  }}
                >삭제</button>
              ) : (
                <button
                  onClick={(e) => { e.stopPropagation(); setPendingDelete(code); }}
                  onTouchStart={(e) => e.stopPropagation()}
                  style={{
                    width: '26px', height: '26px',
                    borderRadius: '50%', background: 'rgba(0, 0, 0, 0.05)',
                    border: 'none', display: 'flex',
                    alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer', flexShrink: 0,
                  }}
                ><XIcon size={14} style={{ color: '#999' }} /></button>
              )
            )}
          </div>
        );
      };

      return (
        <>
          <style>{`
            .app-root {
              font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
              font-feature-settings: 'tnum' 1, 'ss01' 1;
              -webkit-font-smoothing: antialiased;
            }
            .tabular { font-variant-numeric: tabular-nums; }
            @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
            @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            @keyframes pulseIn { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
            .sheet-anim { animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
            .overlay-anim { animation: fadeIn 0.2s ease-out; }
            .row-anim { animation: pulseIn 0.25s ease-out; }
            .row-card { transition: box-shadow 0.25s ease, transform 0.15s ease, opacity 0.2s ease; }
            .row-card:active { transform: scale(0.99); }
            .key-btn { transition: transform 0.08s ease, background-color 0.15s ease; }
            .key-btn:active { transform: scale(0.93); background-color: #f5f3ed !important; }
            .scroll-area { scrollbar-width: none; }
            .scroll-area::-webkit-scrollbar { display: none; }
          `}</style>

          <div className="app-root" style={{
            height: '100vh', width: '100%',
            display: 'flex', flexDirection: 'column',
            background: 'linear-gradient(180deg, #f5f3ed 0%, #ecebe4 100%)',
            color: '#1a1a1a', position: 'relative', overflow: 'hidden',
            paddingTop: 'env(safe-area-inset-top)',
            paddingBottom: 'env(safe-area-inset-bottom)',
          }}>
            <div style={{
              padding: '14px 20px 6px', display: 'flex',
              alignItems: 'center', justifyContent: 'space-between', flexShrink: 0,
            }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <h1 style={{
                  margin: 0, fontSize: '22px', fontWeight: 800,
                  letterSpacing: '-0.6px', color: '#0a3d3d',
                }}>내 환율 계산</h1>
                {statusMsg ? (
                  <div style={{
                    fontSize: '12px',
                    color: '#0a3d3d',
                    marginTop: '5px',
                    fontWeight: 700,
                    letterSpacing: '-0.2px',
                    overflow: 'hidden',
                    textOverflow: 'ellipsis',
                    whiteSpace: 'nowrap',
                  }}>{statusMsg}</div>
                ) : (
                  <div style={{
                    marginTop: '5px',
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: '5px',
                    color: '#666',
                    fontSize: '12px',
                    fontWeight: 600,
                    letterSpacing: '-0.2px',
                  }}>
                    <CalendarIcon size={12} strokeWidth={2.5} />
                    환율 기준 {displayDate}
                  </div>
                )}
              </div>
              <button onClick={refreshRates} disabled={refreshing} style={{
                width: '38px', height: '38px', borderRadius: '50%',
                background: 'rgba(10, 61, 61, 0.08)', border: 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: refreshing ? 'default' : 'pointer', flexShrink: 0, color: '#0a3d3d',
              }} title="환율 다시 가져오기">
                <RefreshIcon size={18} style={{
                  animation: refreshing ? 'spin 1s linear infinite' : 'none',
                }} />
              </button>
            </div>

            <div className="scroll-area" style={{
              flex: '0 1 auto', overflowY: draggedCode ? 'hidden' : 'auto',
              padding: '8px 16px 0', minHeight: 0,
            }}>
              {foreignCodes.length === 0 ? (
                <div style={{
                  padding: '32px 20px', textAlign: 'center',
                  color: '#999', fontSize: '13px',
                  border: '2px dashed rgba(0,0,0,0.08)',
                  borderRadius: '18px',
                  display: 'flex', flexDirection: 'column',
                  alignItems: 'center', gap: '10px',
                }}>
                  <WalletIcon size={32} strokeWidth={1.5} style={{ color: '#bbb' }} />
                  <div style={{ fontWeight: 600, fontSize: '14px', color: '#666' }}>외화가 없습니다</div>
                  <div>아래 <b>통화 추가</b> 버튼을 눌러서<br/>여행지 통화를 추가하세요</div>
                </div>
              ) : (
                foreignCodes.map(code => renderRow(code))
              )}
            </div>

            <div style={{ padding: '0 16px', flexShrink: 0 }}>
              {renderRow('KRW', { noMargin: true })}
            </div>

            <div style={{ padding: '6px 16px 4px', flexShrink: 0 }}>
              <button
                onClick={() => setShowSheet(true)}
                className="key-btn"
                style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  width: '100%', padding: '8px 13px',
                  background: 'transparent',
                  border: '2px dashed rgba(10, 61, 61, 0.22)',
                  borderRadius: '12px', color: '#0a3d3d',
                  fontSize: '13.5px', fontWeight: 700,
                  cursor: 'pointer', fontFamily: 'inherit',
                  letterSpacing: '-0.2px',
                }}
              >
                <PlusIcon size={16} style={{ marginRight: '5px' }} strokeWidth={2.5} />
                통화 추가
                <span style={{
                  marginLeft: '9px', padding: '1px 8px',
                  background: 'rgba(10, 61, 61, 0.1)',
                  borderRadius: '9px', fontSize: '10.5px', fontWeight: 700,
                }}>+{CURRENCIES_FOR_PICKER.length - foreignCodes.length}</span>
              </button>
            </div>

            {/* 빈 공간 (통화 추가와 키패드 사이) */}
            <div style={{
              flex: '1 1 0', minHeight: 0,
            }} />

            <div style={{
              padding: '12px 10px 14px',
              background: 'linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.7) 100%)',
              borderTop: '1px solid rgba(0, 0, 0, 0.06)',
              flexShrink: 0,
            }}>
              {/* 진행 중인 연산 표시 */}
              {pendingOp && firstOperand !== null && (
                <div style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'flex-end',
                  padding: '0 8px 8px',
                  fontSize: '15px', color: '#0a3d3d',
                  fontWeight: 700, gap: '8px',
                }}>
                  <span className="tabular" style={{ color: '#666' }}>
                    {formatTypedAmount(firstOperand)}
                  </span>
                  <span style={{
                    fontSize: '20px',
                    color: '#e76f51',
                    fontWeight: 800,
                    lineHeight: 1,
                  }}>{pendingOp}</span>
                </div>
              )}

              {/* 4열 계산기 키패드 */}
              <div style={{
                display: 'grid',
                gridTemplateColumns: 'repeat(4, 1fr)',
                gap: '8px',
              }}>
                {/* 행 1: 7 8 9 ÷ */}
                <button className="key-btn" onClick={() => handleKey('7')} style={numberKeyStyle}>7</button>
                <button className="key-btn" onClick={() => handleKey('8')} style={numberKeyStyle}>8</button>
                <button className="key-btn" onClick={() => handleKey('9')} style={numberKeyStyle}>9</button>
                <button className="key-btn op-btn" onClick={() => handleKey('÷')}
                  style={pendingOp === '÷' && resetOnNext ? opActiveStyle : opKeyStyle}>÷</button>

                {/* 행 2: 4 5 6 × */}
                <button className="key-btn" onClick={() => handleKey('4')} style={numberKeyStyle}>4</button>
                <button className="key-btn" onClick={() => handleKey('5')} style={numberKeyStyle}>5</button>
                <button className="key-btn" onClick={() => handleKey('6')} style={numberKeyStyle}>6</button>
                <button className="key-btn op-btn" onClick={() => handleKey('×')}
                  style={pendingOp === '×' && resetOnNext ? opActiveStyle : opKeyStyle}>×</button>

                {/* 행 3: 1 2 3 = */}
                <button className="key-btn" onClick={() => handleKey('1')} style={numberKeyStyle}>1</button>
                <button className="key-btn" onClick={() => handleKey('2')} style={numberKeyStyle}>2</button>
                <button className="key-btn" onClick={() => handleKey('3')} style={numberKeyStyle}>3</button>
                <button className="key-btn op-btn" onClick={() => handleKey('=')} style={equalsKeyStyle}>=</button>

                {/* 행 4: 0(span 2) . ⌫ */}
                <button className="key-btn" onClick={() => handleKey('0')}
                  style={{...numberKeyStyle, gridColumn: 'span 2', textAlign: 'center'}}>0</button>
                <button className="key-btn" onClick={() => handleKey('.')}
                  style={{...numberKeyStyle, fontWeight: 900}}>.</button>
                <button className="key-btn" onClick={() => handleKey('⌫')} style={{
                  ...numberKeyStyle,
                  background: '#dcd5c4',
                  color: '#5a5a5a',
                  boxShadow: '0 3px 0 rgba(0,0,0,0.10), 0 5px 12px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.6)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}><DeleteIcon size={26} strokeWidth={2.3} /></button>
              </div>

              <button className="key-btn" onClick={clearAll} style={{
                marginTop: '9px', width: '100%', padding: '15px 0',
                fontSize: '16px', fontWeight: 800,
                background: 'linear-gradient(135deg, #e76f51 0%, #c84a36 100%)',
                color: '#fff', border: 'none', borderRadius: '16px',
                cursor: 'pointer', fontFamily: 'inherit',
                letterSpacing: '3px',
                boxShadow: '0 4px 14px rgba(200, 74, 54, 0.32), 0 2px 0 rgba(120, 30, 20, 0.15), inset 0 1px 0 rgba(255,255,255,0.18)',
              }}>전체 지우기</button>
            </div>

            {showSheet && (
              <div className="overlay-anim" onClick={() => { setShowSheet(false); setSearchQuery(''); }} style={{
                position: 'absolute', inset: 0, background: 'rgba(0, 0, 0, 0.45)',
                zIndex: 20, display: 'flex', alignItems: 'flex-end',
              }}>
                <div className="sheet-anim" onClick={e => e.stopPropagation()} style={{
                  width: '100%', maxHeight: '80vh', background: '#fff',
                  borderRadius: '24px 24px 0 0', padding: '12px 0 20px',
                  display: 'flex', flexDirection: 'column',
                  boxShadow: '0 -8px 32px rgba(0, 0, 0, 0.2)',
                  paddingBottom: 'calc(20px + env(safe-area-inset-bottom))',
                }}>
                  <div style={{
                    width: '40px', height: '4px',
                    background: '#ddd', borderRadius: '2px',
                    margin: '0 auto 14px',
                  }} />
                  <div style={{
                    padding: '0 20px', display: 'flex',
                    alignItems: 'baseline', justifyContent: 'space-between',
                    marginBottom: '12px',
                  }}>
                    <h2 style={{
                      margin: 0, fontSize: '19px', fontWeight: 800,
                      color: '#0a3d3d', letterSpacing: '-0.5px',
                    }}>통화 추가</h2>
                    <span style={{ fontSize: '12px', color: '#888' }}>{hiddenForeign.length}개 통화</span>
                  </div>
                  <div style={{
                    margin: '0 20px 8px', display: 'flex', alignItems: 'center',
                    background: '#f5f3ed', borderRadius: '12px', padding: '10px 14px',
                  }}>
                    <SearchIcon size={16} style={{ color: '#aaa', marginRight: '8px', flexShrink: 0 }} />
                    <input type="text" placeholder="통화 코드 또는 이름 검색"
                      value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                      style={{
                        flex: 1, border: 'none', background: 'transparent',
                        outline: 'none', fontSize: '14px',
                        fontFamily: 'inherit', color: '#1a1a1a', minWidth: 0,
                      }} />
                  </div>
                  <div className="scroll-area" style={{
                    flex: 1, overflowY: 'auto',
                    padding: '0 20px', minHeight: '200px',
                  }}>
                    {hiddenForeign.map(c => {
                      const cRate = (rates[c.code] && rates['KRW']) ? rates['KRW'] / rates[c.code] : null;
                      return (
                        <button key={c.code} onClick={() => addForeign(c.code)} style={{
                          display: 'flex', alignItems: 'center', width: '100%',
                          padding: '12px 4px', background: 'transparent',
                          border: 'none', borderBottom: '1px solid rgba(0, 0, 0, 0.05)',
                          cursor: 'pointer', textAlign: 'left', fontFamily: 'inherit',
                        }}>
                          <span style={{ fontSize: '28px', marginRight: '14px', lineHeight: 1 }}>{c.flag}</span>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: '15px', fontWeight: 700, color: '#1a1a1a' }}>{c.code}</div>
                            <div style={{
                              fontSize: '12px', color: '#999', marginTop: '2px',
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                            }}>{c.name}</div>
                          </div>
                          {cRate && (
                            <div className="tabular" style={{
                              fontSize: '11px', color: '#888',
                              marginRight: '10px', textAlign: 'right',
                            }}>
                              <div style={{ fontSize: '10px', color: '#bbb' }}>1 {c.code} =</div>
                              <div style={{ fontWeight: 600, color: '#555' }}>{formatNumber(cRate, 'KRW')} 원</div>
                            </div>
                          )}
                          <div style={{
                            width: '30px', height: '30px',
                            borderRadius: '50%', background: '#0a3d3d',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            flexShrink: 0,
                          }}><PlusIcon size={16} style={{ color: '#fff' }} strokeWidth={2.8} /></div>
                        </button>
                      );
                    })}
                    {hiddenForeign.length === 0 && (
                      <div style={{
                        textAlign: 'center', padding: '60px 20px',
                        color: '#999', fontSize: '14px',
                      }}>
                        {searchQuery ? '검색 결과가 없습니다' : '모든 통화가 이미 추가되어 있습니다'}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // 새 SW가 발견되면 즉시 활성화 시도
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (sw) {
              sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  // 새 버전 준비됨 → 활성화 명령
                  sw.postMessage('SKIP_WAITING');
                }
              });
            }
          });
        }).catch(() => {});
        // 새 SW가 활성화되면 페이지 자동 새로고침 (한 번만)
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
