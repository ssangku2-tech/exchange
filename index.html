<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="환율계산" />
  <meta name="theme-color" content="#0a3d3d" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>내 환율 계산</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body { overscroll-behavior: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    const PINNED_TOP_CODES = ['USD', 'EUR'];

    const CURRENCIES_RAW = [
      { code: 'USD', name: '미국 달러', flag: '🇺🇸' },
      { code: 'EUR', name: '유로', flag: '🇪🇺' },
      { code: 'JPY', name: '일본 엔', flag: '🇯🇵' },
      { code: 'CNY', name: '중국 위안', flag: '🇨🇳' },
      { code: 'GBP', name: '영국 파운드', flag: '🇬🇧' },
      { code: 'AUD', name: '호주 달러', flag: '🇦🇺' },
      { code: 'CAD', name: '캐나다 달러', flag: '🇨🇦' },
      { code: 'CHF', name: '스위스 프랑', flag: '🇨🇭' },
      { code: 'HKD', name: '홍콩 달러', flag: '🇭🇰' },
      { code: 'SGD', name: '싱가포르 달러', flag: '🇸🇬' },
      { code: 'THB', name: '태국 바트', flag: '🇹🇭' },
      { code: 'VND', name: '베트남 동', flag: '🇻🇳' },
      { code: 'IDR', name: '인도네시아 루피아', flag: '🇮🇩' },
      { code: 'MYR', name: '말레이시아 링깃', flag: '🇲🇾' },
      { code: 'PHP', name: '필리핀 페소', flag: '🇵🇭' },
      { code: 'INR', name: '인도 루피', flag: '🇮🇳' },
      { code: 'TWD', name: '대만 달러', flag: '🇹🇼' },
      { code: 'TRY', name: '터키 리라', flag: '🇹🇷' },
      { code: 'BRL', name: '브라질 헤알', flag: '🇧🇷' },
      { code: 'MXN', name: '멕시코 페소', flag: '🇲🇽' },
      { code: 'RUB', name: '러시아 루블', flag: '🇷🇺' },
      { code: 'AED', name: 'UAE 디르함', flag: '🇦🇪' },
      { code: 'SAR', name: '사우디 리얄', flag: '🇸🇦' },
      { code: 'NZD', name: '뉴질랜드 달러', flag: '🇳🇿' },
      { code: 'SEK', name: '스웨덴 크로나', flag: '🇸🇪' },
      { code: 'NOK', name: '노르웨이 크로네', flag: '🇳🇴' },
      { code: 'DKK', name: '덴마크 크로네', flag: '🇩🇰' },
      { code: 'PLN', name: '폴란드 즈워티', flag: '🇵🇱' },
      { code: 'CZK', name: '체코 코루나', flag: '🇨🇿' },
      { code: 'HUF', name: '헝가리 포린트', flag: '🇭🇺' },
      { code: 'ZAR', name: '남아공 랜드', flag: '🇿🇦' },
    ];

    // USD, EUR을 항상 맨 위에 고정하고 나머지는 통화코드(ABC) 순으로 정렬
    const CURRENCIES = [
      ...PINNED_TOP_CODES.map(code => CURRENCIES_RAW.find(c => c.code === code)).filter(Boolean),
      ...CURRENCIES_RAW
        .filter(c => !PINNED_TOP_CODES.includes(c.code))
        .sort((a, b) => a.code.localeCompare(b.code)),
    ];

    const KRW_CURRENCY = { code: 'KRW', name: '대한민국 원', flag: '🇰🇷' };
    const NO_DECIMAL = ['JPY', 'VND', 'IDR', 'KRW'];

    const STORAGE_KEY = 'exchange_calc_v2';
    const DEFAULT_RATES_DATE = '2026-05-13';
    const DEFAULT_RATES = {
      USD: 1, KRW: 1488, EUR: 0.852, JPY: 157.6, CNY: 6.79, GBP: 0.739,
      AUD: 1.383, CAD: 1.37, CHF: 0.781, HKD: 7.83, SGD: 1.27, THB: 32.39,
      VND: 25500, IDR: 17509, MYR: 3.93, PHP: 61.48, INR: 95.62, TWD: 31.51,
      TRY: 38.5, BRL: 5.5, MXN: 17.25, RUB: 90, AED: 3.67, SAR: 3.75,
      NZD: 1.681, SEK: 9.29, NOK: 10.8, DKK: 6.36, PLN: 4.2, CZK: 23.0,
      HUF: 304.5, ZAR: 18.5,
    };

    // Inline SVG icons (lucide style)
    const Icon = ({ d, size = 18, strokeWidth = 2, ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" {...props}>{d}</svg>
    );
    const PlusIcon = (props) => <Icon {...props} d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
    const XIcon = (props) => <Icon {...props} d={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />;
    const SearchIcon = (props) => <Icon {...props} d={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />;
    const DeleteIcon = (props) => <Icon {...props} d={<><path d="M21 5H9l-7 7 7 7h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></>} />;
    const RefreshIcon = (props) => <Icon {...props} d={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></>} />;
    const WalletIcon = (props) => <Icon {...props} d={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />;
    const CalendarIcon = (props) => <Icon {...props} d={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />;

    function App() {
      const [foreignCodes, setForeignCodes] = useState(['USD', 'EUR', 'JPY']);
      const [baseCurrency, setBaseCurrency] = useState('EUR');
      const [amount, setAmount] = useState('100');
      const [showSheet, setShowSheet] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [rates, setRates] = useState(DEFAULT_RATES);
      const [ratesDate, setRatesDate] = useState(DEFAULT_RATES_DATE);
      const [refreshing, setRefreshing] = useState(false);
      const [statusMsg, setStatusMsg] = useState('');

      const getYesterdayStr = () => {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        return d.toISOString().split('T')[0];
      };
      const isCacheFresh = (cacheDateStr) => {
        if (!cacheDateStr) return false;
        return cacheDateStr >= getYesterdayStr();
      };

      useEffect(() => {
        let cachedDate = null;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const cached = JSON.parse(raw);
            if (cached.rates && cached.date) {
              setRates(cached.rates);
              setRatesDate(cached.date);
              cachedDate = cached.date;
            }
            if (Array.isArray(cached.foreignCodes) && cached.foreignCodes.length > 0) {
              setForeignCodes(cached.foreignCodes);
            }
            if (cached.baseCurrency) setBaseCurrency(cached.baseCurrency);
          }
        } catch (e) {}
        if (!isCacheFresh(cachedDate)) {
          refreshRates();
        }
      }, []);

      const refreshRates = async () => {
        setRefreshing(true);
        setStatusMsg('환율 업데이트 중...');
        try {
          const res = await fetch('https://open.er-api.com/v6/latest/USD');
          if (!res.ok) throw new Error('네트워크 오류');
          const data = await res.json();
          if (data.result !== 'success' || !data.rates || !data.rates.KRW) {
            throw new Error('환율 데이터 오류');
          }
          const fetchDate = data.time_last_update_utc
            ? new Date(data.time_last_update_utc).toISOString().split('T')[0]
            : new Date().toISOString().split('T')[0];

          setRates(data.rates);
          setRatesDate(fetchDate);
          setStatusMsg('업데이트 완료');
          saveState({ rates: data.rates, date: fetchDate });
          setTimeout(() => setStatusMsg(''), 2500);
        } catch (err) {
          setStatusMsg('오프라인 - 저장된 환율 사용');
          setTimeout(() => setStatusMsg(''), 3500);
        }
        setRefreshing(false);
      };

      const saveState = (overrides = {}) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            date: overrides.date ?? ratesDate,
            rates: overrides.rates ?? rates,
            foreignCodes: overrides.foreignCodes ?? foreignCodes,
            baseCurrency: overrides.baseCurrency ?? baseCurrency,
            fetchedAt: new Date().toISOString(),
          }));
        } catch (e) {}
      };

      const allWithKrw = [...CURRENCIES, KRW_CURRENCY];
      const getCurrency = (code) => allWithKrw.find(c => c.code === code);

      const formatNumber = (n, code) => {
        if (!isFinite(n)) return '—';
        if (NO_DECIMAL.includes(code)) return Math.round(n).toLocaleString('ko-KR');
        return n.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };
      const formatTypedAmount = (str) => {
        if (!str || str === '0') return '0';
        if (str === '0.') return '0.';
        const [intPart, decPart] = str.split('.');
        const intFormatted = parseInt(intPart || '0').toLocaleString('ko-KR');
        return decPart !== undefined ? `${intFormatted}.${decPart}` : intFormatted;
      };
      const convert = (code) => {
        if (code === baseCurrency) return formatTypedAmount(amount);
        if (!rates[baseCurrency] || !rates[code]) return '—';
        const n = parseFloat(amount) || 0;
        const usd = n / rates[baseCurrency];
        return formatNumber(usd * rates[code], code);
      };
      const handleKey = (key) => {
        setAmount(prev => {
          if (key === 'C') return '0';
          if (key === '⌫') return prev.length <= 1 ? '0' : prev.slice(0, -1);
          if (key === '.') return prev.includes('.') ? prev : prev + '.';
          if (prev === '0') return key;
          const digits = prev.replace('.', '');
          if (digits.length >= 14) return prev;
          return prev + key;
        });
      };
      const addForeign = (code) => {
        if (!foreignCodes.includes(code)) {
          const newCodes = [...foreignCodes, code];
          setForeignCodes(newCodes);
          setBaseCurrency(code);
          saveState({ foreignCodes: newCodes, baseCurrency: code });
        }
        setShowSheet(false);
        setSearchQuery('');
      };
      const removeForeign = (code) => {
        const remaining = foreignCodes.filter(c => c !== code);
        setForeignCodes(remaining);
        let newBase = baseCurrency;
        if (baseCurrency === code) {
          newBase = remaining.length > 0 ? remaining[0] : 'KRW';
          setBaseCurrency(newBase);
        }
        saveState({ foreignCodes: remaining, baseCurrency: newBase });
      };
      const selectBase = (code) => {
        setBaseCurrency(code);
        saveState({ baseCurrency: code });
      };

      const hiddenForeign = CURRENCIES.filter(c =>
        !foreignCodes.includes(c.code) &&
        (searchQuery === '' ||
          c.code.toLowerCase().includes(searchQuery.toLowerCase()) ||
          c.name.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      const numberKeyStyle = {
        padding: '17px 0', fontSize: '25px', fontWeight: 700,
        background: '#ffffff', color: '#1a1a1a', border: 'none',
        borderRadius: '16px',
        boxShadow: '0 2px 0 rgba(0,0,0,0.07), 0 5px 14px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.7)',
        cursor: 'pointer', fontFamily: 'inherit',
        letterSpacing: '0.5px',
      };

      const displayDate = ratesDate.replace(/-/g, '.');

      const renderRow = (code, opts = {}) => {
        const c = getCurrency(code);
        const isBase = code === baseCurrency;
        const isKrw = code === 'KRW';
        return (
          <div
            key={code}
            onClick={() => selectBase(code)}
            className="row-card row-anim"
            style={{
              display: 'flex', alignItems: 'center',
              padding: '14px 16px',
              marginBottom: opts.noMargin ? 0 : '8px',
              background: isBase ? '#0a3d3d' : '#ffffff',
              borderRadius: '18px',
              boxShadow: isBase
                ? '0 10px 28px rgba(10, 61, 61, 0.28), 0 2px 4px rgba(10, 61, 61, 0.15)'
                : '0 1px 2px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.03)',
              cursor: 'pointer', minHeight: '70px',
              position: 'relative', overflow: 'hidden',
            }}
          >
            {isBase && (
              <div style={{
                position: 'absolute', top: 9, right: 16,
                fontSize: '9px', color: 'rgba(255,255,255,0.55)',
                fontWeight: 700, letterSpacing: '1.5px',
              }}>BASE</div>
            )}
            {isKrw && !isBase && (
              <div style={{
                position: 'absolute', top: 9, right: 16,
                fontSize: '9px', color: '#bbb',
                fontWeight: 700, letterSpacing: '1.5px',
              }}>원화</div>
            )}
            <div style={{ fontSize: '34px', marginRight: '14px', lineHeight: 1, flexShrink: 0 }}>{c?.flag}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                fontSize: '17px', fontWeight: 800,
                color: isBase ? '#fff' : '#1a1a1a',
                letterSpacing: '0.4px', lineHeight: 1.2,
              }}>{code}</div>
              <div style={{
                fontSize: '12px',
                color: isBase ? 'rgba(255,255,255,0.55)' : '#999',
                marginTop: '3px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }}>{c?.name}</div>
            </div>
            <div className="tabular" style={{
              fontSize: '22px', fontWeight: 700,
              color: isBase ? '#fff' : '#1a1a1a',
              letterSpacing: '-0.5px',
              marginRight: !isBase && !isKrw ? '8px' : 0,
              textAlign: 'right',
            }}>{convert(code)}</div>
            {!isBase && !isKrw && (
              <button
                onClick={(e) => { e.stopPropagation(); removeForeign(code); }}
                style={{
                  width: '26px', height: '26px',
                  borderRadius: '50%', background: 'rgba(0, 0, 0, 0.05)',
                  border: 'none', display: 'flex',
                  alignItems: 'center', justifyContent: 'center',
                  cursor: 'pointer', flexShrink: 0,
                }}
              ><XIcon size={14} style={{ color: '#999' }} /></button>
            )}
          </div>
        );
      };

      return (
        <>
          <style>{`
            .app-root {
              font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
              font-feature-settings: 'tnum' 1, 'ss01' 1;
              -webkit-font-smoothing: antialiased;
            }
            .tabular { font-variant-numeric: tabular-nums; }
            @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
            @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            @keyframes pulseIn { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
            .sheet-anim { animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
            .overlay-anim { animation: fadeIn 0.2s ease-out; }
            .row-anim { animation: pulseIn 0.25s ease-out; }
            .row-card { transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.1s ease; }
            .row-card:active { transform: scale(0.985); }
            .key-btn { transition: transform 0.08s ease, background-color 0.15s ease; }
            .key-btn:active { transform: scale(0.93); background-color: #f5f3ed !important; }
            .scroll-area { scrollbar-width: none; }
            .scroll-area::-webkit-scrollbar { display: none; }
          `}</style>

          <div className="app-root" style={{
            height: '100vh', width: '100%',
            display: 'flex', flexDirection: 'column',
            background: 'linear-gradient(180deg, #f5f3ed 0%, #ecebe4 100%)',
            color: '#1a1a1a', position: 'relative', overflow: 'hidden',
            paddingTop: 'env(safe-area-inset-top)',
            paddingBottom: 'env(safe-area-inset-bottom)',
          }}>
            <div style={{
              padding: '14px 20px 6px', display: 'flex',
              alignItems: 'center', justifyContent: 'space-between', flexShrink: 0,
            }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <h1 style={{
                  margin: 0, fontSize: '22px', fontWeight: 800,
                  letterSpacing: '-0.6px', color: '#0a3d3d',
                }}>내 환율 계산</h1>
                {statusMsg ? (
                  <div style={{
                    fontSize: '12px',
                    color: '#0a3d3d',
                    marginTop: '5px',
                    fontWeight: 700,
                    letterSpacing: '-0.2px',
                    overflow: 'hidden',
                    textOverflow: 'ellipsis',
                    whiteSpace: 'nowrap',
                  }}>{statusMsg}</div>
                ) : (
                  <div style={{
                    marginTop: '5px',
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: '5px',
                    color: '#666',
                    fontSize: '12px',
                    fontWeight: 600,
                    letterSpacing: '-0.2px',
                  }}>
                    <CalendarIcon size={12} strokeWidth={2.5} />
                    환율 기준 {displayDate}
                  </div>
                )}
              </div>
              <button onClick={refreshRates} disabled={refreshing} style={{
                width: '38px', height: '38px', borderRadius: '50%',
                background: 'rgba(10, 61, 61, 0.08)', border: 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: refreshing ? 'default' : 'pointer', flexShrink: 0, color: '#0a3d3d',
              }} title="환율 다시 가져오기">
                <RefreshIcon size={18} style={{
                  animation: refreshing ? 'spin 1s linear infinite' : 'none',
                }} />
              </button>
            </div>

            <div className="scroll-area" style={{
              flex: '0 1 auto', overflowY: 'auto',
              padding: '8px 16px 0', minHeight: 0,
            }}>
              {foreignCodes.length === 0 ? (
                <div style={{
                  padding: '32px 20px', textAlign: 'center',
                  color: '#999', fontSize: '13px',
                  border: '2px dashed rgba(0,0,0,0.08)',
                  borderRadius: '18px',
                  display: 'flex', flexDirection: 'column',
                  alignItems: 'center', gap: '10px',
                }}>
                  <WalletIcon size={32} strokeWidth={1.5} style={{ color: '#bbb' }} />
                  <div style={{ fontWeight: 600, fontSize: '14px', color: '#666' }}>외화가 없습니다</div>
                  <div>아래 <b>통화 추가</b> 버튼을 눌러서<br/>여행지 통화를 추가하세요</div>
                </div>
              ) : (
                foreignCodes.map(code => renderRow(code))
              )}
            </div>

            <div style={{ padding: '0 16px', flexShrink: 0 }}>
              {renderRow('KRW', { noMargin: true })}
            </div>

            <div style={{ padding: '10px 16px 6px', flexShrink: 0 }}>
              <button
                onClick={() => setShowSheet(true)}
                className="key-btn"
                style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  width: '100%', padding: '13px',
                  background: 'transparent',
                  border: '2px dashed rgba(10, 61, 61, 0.22)',
                  borderRadius: '14px', color: '#0a3d3d',
                  fontSize: '14px', fontWeight: 700,
                  cursor: 'pointer', fontFamily: 'inherit',
                  letterSpacing: '-0.2px',
                }}
              >
                <PlusIcon size={18} style={{ marginRight: '6px' }} strokeWidth={2.5} />
                통화 추가
                <span style={{
                  marginLeft: '10px', padding: '2px 9px',
                  background: 'rgba(10, 61, 61, 0.1)',
                  borderRadius: '10px', fontSize: '11px', fontWeight: 700,
                }}>+{CURRENCIES.length - foreignCodes.length}</span>
              </button>
            </div>

            {/* 빈 공간 (통화 추가와 키패드 사이) */}
            <div style={{
              flex: '1 1 0', minHeight: 0,
            }} />

            <div style={{
              padding: '12px 12px 16px',
              background: 'rgba(255, 255, 255, 0.65)',
              borderTop: '1px solid rgba(0, 0, 0, 0.06)',
              flexShrink: 0,
            }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '9px' }}>
                {['7','8','9','4','5','6','1','2','3'].map(k => (
                  <button key={k} className="key-btn" onClick={() => handleKey(k)} style={numberKeyStyle}>{k}</button>
                ))}
                <button className="key-btn" onClick={() => handleKey('.')} style={{...numberKeyStyle, fontWeight: 800}}>.</button>
                <button className="key-btn" onClick={() => handleKey('0')} style={numberKeyStyle}>0</button>
                <button className="key-btn" onClick={() => handleKey('⌫')} style={{
                  ...numberKeyStyle,
                  background: '#e8e1d1',
                  color: '#5a5a5a',
                  boxShadow: '0 2px 0 rgba(0,0,0,0.07), 0 5px 10px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.6)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}><DeleteIcon size={24} strokeWidth={2.2} /></button>
              </div>
              <button className="key-btn" onClick={() => setAmount('0')} style={{
                marginTop: '9px', width: '100%', padding: '15px 0',
                fontSize: '16px', fontWeight: 800,
                background: 'linear-gradient(135deg, #e76f51 0%, #c84a36 100%)',
                color: '#fff', border: 'none', borderRadius: '16px',
                cursor: 'pointer', fontFamily: 'inherit',
                letterSpacing: '3px',
                boxShadow: '0 4px 14px rgba(200, 74, 54, 0.32), 0 2px 0 rgba(120, 30, 20, 0.15), inset 0 1px 0 rgba(255,255,255,0.18)',
              }}>C · 전체 지우기</button>
            </div>

            {showSheet && (
              <div className="overlay-anim" onClick={() => { setShowSheet(false); setSearchQuery(''); }} style={{
                position: 'absolute', inset: 0, background: 'rgba(0, 0, 0, 0.45)',
                zIndex: 20, display: 'flex', alignItems: 'flex-end',
              }}>
                <div className="sheet-anim" onClick={e => e.stopPropagation()} style={{
                  width: '100%', maxHeight: '80vh', background: '#fff',
                  borderRadius: '24px 24px 0 0', padding: '12px 0 20px',
                  display: 'flex', flexDirection: 'column',
                  boxShadow: '0 -8px 32px rgba(0, 0, 0, 0.2)',
                  paddingBottom: 'calc(20px + env(safe-area-inset-bottom))',
                }}>
                  <div style={{
                    width: '40px', height: '4px',
                    background: '#ddd', borderRadius: '2px',
                    margin: '0 auto 14px',
                  }} />
                  <div style={{
                    padding: '0 20px', display: 'flex',
                    alignItems: 'baseline', justifyContent: 'space-between',
                    marginBottom: '12px',
                  }}>
                    <h2 style={{
                      margin: 0, fontSize: '19px', fontWeight: 800,
                      color: '#0a3d3d', letterSpacing: '-0.5px',
                    }}>통화 추가</h2>
                    <span style={{ fontSize: '12px', color: '#888' }}>{hiddenForeign.length}개 통화</span>
                  </div>
                  <div style={{
                    margin: '0 20px 8px', display: 'flex', alignItems: 'center',
                    background: '#f5f3ed', borderRadius: '12px', padding: '10px 14px',
                  }}>
                    <SearchIcon size={16} style={{ color: '#aaa', marginRight: '8px', flexShrink: 0 }} />
                    <input type="text" placeholder="통화 코드 또는 이름 검색"
                      value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                      style={{
                        flex: 1, border: 'none', background: 'transparent',
                        outline: 'none', fontSize: '14px',
                        fontFamily: 'inherit', color: '#1a1a1a', minWidth: 0,
                      }} />
                  </div>
                  <div className="scroll-area" style={{
                    flex: 1, overflowY: 'auto',
                    padding: '0 20px', minHeight: '200px',
                  }}>
                    {hiddenForeign.map(c => {
                      const cRate = (rates[c.code] && rates['KRW']) ? rates['KRW'] / rates[c.code] : null;
                      return (
                        <button key={c.code} onClick={() => addForeign(c.code)} style={{
                          display: 'flex', alignItems: 'center', width: '100%',
                          padding: '12px 4px', background: 'transparent',
                          border: 'none', borderBottom: '1px solid rgba(0, 0, 0, 0.05)',
                          cursor: 'pointer', textAlign: 'left', fontFamily: 'inherit',
                        }}>
                          <span style={{ fontSize: '28px', marginRight: '14px', lineHeight: 1 }}>{c.flag}</span>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: '15px', fontWeight: 700, color: '#1a1a1a' }}>{c.code}</div>
                            <div style={{
                              fontSize: '12px', color: '#999', marginTop: '2px',
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                            }}>{c.name}</div>
                          </div>
                          {cRate && (
                            <div className="tabular" style={{
                              fontSize: '11px', color: '#888',
                              marginRight: '10px', textAlign: 'right',
                            }}>
                              <div style={{ fontSize: '10px', color: '#bbb' }}>1 {c.code} =</div>
                              <div style={{ fontWeight: 600, color: '#555' }}>{formatNumber(cRate, 'KRW')} 원</div>
                            </div>
                          )}
                          <div style={{
                            width: '30px', height: '30px',
                            borderRadius: '50%', background: '#0a3d3d',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            flexShrink: 0,
                          }}><PlusIcon size={16} style={{ color: '#fff' }} strokeWidth={2.8} /></div>
                        </button>
                      );
                    })}
                    {hiddenForeign.length === 0 && (
                      <div style={{
                        textAlign: 'center', padding: '60px 20px',
                        color: '#999', fontSize: '14px',
                      }}>
                        {searchQuery ? '검색 결과가 없습니다' : '모든 통화가 이미 추가되어 있습니다'}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // 새 SW가 발견되면 즉시 활성화 시도
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (sw) {
              sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  // 새 버전 준비됨 → 활성화 명령
                  sw.postMessage('SKIP_WAITING');
                }
              });
            }
          });
        }).catch(() => {});
        // 새 SW가 활성화되면 페이지 자동 새로고침 (한 번만)
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
